<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — ระบบติดตามคดี</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&family=Kanit:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sarabun',sans-serif;
  background:#0d1117;
  color:#e6edf3;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.bg-glow{
  z-index:0;
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%, #f0883e18 0%, transparent 60%);
}
.box{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:16px;
  padding:40px 36px;
  width:100%;
  max-width:380px;
  position:relative;
  z-index:1;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
.logo{text-align:center;margin-bottom:28px;}
.logo-icon{font-size:2.8rem;margin-bottom:8px;}
.logo h1{
  font-family:'Kanit',sans-serif;
  font-size:1.4rem;
  font-weight:700;
  color:#f0883e;
  margin-bottom:4px;
}
.logo p{font-size:0.8rem;color:#6e7681;}

label{
display:block;
font-size:0.78rem;
color:#8b949e;
margin-bottom:5px;
font-weight:500;
}
input{
width:100%;
padding:11px 14px;
background:#0d1117;
border:1px solid #30363d;
border-radius:9px;
color:#e6edf3;
font-family:‘Sarabun’,sans-serif;
font-size:0.9rem;
outline:none;
transition:border-color 0.15s,box-shadow 0.15s;
margin-bottom:16px;
}
input:focus{
border-color:#f0883e;
box-shadow:0 0 0 3px #f0883e18;
}
input::placeholder{color:#6e7681;}

button{
width:100%;
padding:12px;
background:#f0883e;
border:none;
border-radius:9px;
color:#fff;
font-family:‘Kanit’,sans-serif;
font-size:1rem;
font-weight:600;
cursor:pointer;
transition:opacity 0.15s,transform 0.1s;
margin-top:4px;
}
button:hover{opacity:0.88;}
button:active{transform:scale(0.98);}
button:disabled{opacity:0.5;cursor:not-allowed;}

.err{
color:#f85149;
font-size:0.8rem;
margin-top:10px;
text-align:center;
min-height:20px;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
}

.footer{
text-align:center;
margin-top:24px;
font-size:0.72rem;
color:#6e7681;
}

/* loading spinner */
.spinner{
display:inline-block;
width:16px;height:16px;
border:2px solid #ffffff44;
border-top-color:#fff;
border-radius:50%;
animation:spin 0.7s linear infinite;
vertical-align:middle;
margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}

    <h1>ระบบติดตามคดี</h1>
    <p>กรุณาเข้าสู่ระบบด้วยบัญชีที่ได้รับ</p>
  </div>

<label for="email">อีเมล</label>
<input type="email" id="email" placeholder="email@example.com" autocomplete="email">

<label for="password">รหัสผ่าน</label>
<input type="password" id="password" placeholder="รหัสผ่าน" autocomplete="current-password"
onkeydown="if(event.key==='Enter')login()">

<button id="loginBtn" onclick="login()">เข้าสู่ระบบ</button>

  <div class="err" id="errMsg"></div>

  <div class="footer">korat-case · ระบบจัดการคดีความ</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword }
  from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyDuyQeVuxcwKd-_fSgTHhmoBo56cZpUI3A",
  authDomain: "korat-case.firebaseapp.com",
  projectId: "korat-case",
  storageBucket: "korat-case.firebasestorage.app",
  messagingSenderId: "64254577929",
  appId: "1:64254577929:web:7d38588fb2e40ede6697d8"
};

const auth = getAuth(initializeApp(firebaseConfig));

window.login = async function() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const err      = document.getElementById('errMsg');

  err.textContent = '';

  if (!email || !password) {
    err.innerHTML = '⚠️ กรุณากรอก Email และ Password';
    return;
  }

  // Show loading
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>กำลังเข้าสู่ระบบ...';

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = 'index.html';
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ';
    const code = e.code || '';
    if (code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) {
      err.innerHTML = '❌ Email หรือ Password ไม่ถูกต้อง';
    } else if (code.includes('too-many-requests')) {
      err.innerHTML = '⏳ ลองผิดหลายครั้ง กรุณารอสักครู่';
    } else if (code.includes('network')) {
      err.innerHTML = '🌐 ไม่มีสัญญาณอินเทอร์เน็ต';
    } else {
      err.innerHTML = '❌ เกิดข้อผิดพลาด กรุณาลองใหม่';
    }
  }
};
</script>
