.box{
  background:rgba(13,17,23,0.45);
  border:1px solid rgba(240,136,62,0.3);
  border-radius:20px;
  padding:48px 44px;
  width:100%;max-width:460px;
  position:relative;z-index:1;
  box-shadow:0 8px 40px rgba(0,0,0,0.6);
}
.logo{text-align:center;margin-bottom:8px;}
.logo img{width:72px;height:72px;object-fit:contain;}
h1{text-align:center;font-family:'Kanit',sans-serif;font-size:1.5rem;font-weight:700;color:#f0883e;margin-bottom:4px;}
.subtitle{text-align:center;font-size:1.3rem;font-weight:700;color:#f0883e;letter-spacing:0.05em;margin-bottom:6px;}
.desc{text-align:center;font-size:0.85rem;color:rgba(230,237,243,0.7);margin-bottom:24px;margin-top:16px;text-shadow:0 1px 3px rgba(0,0,0,0.6);}
label{display:block;font-size:0.8rem;color:rgba(230,237,243,0.7);margin-bottom:4px;}
input{width:100%;padding:11px 14px;background:rgba(13,17,23,0.7);border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-family:'Sarabun',sans-serif;font-size:0.95rem;outline:none;margin-bottom:14px;}
input:focus{border-color:#f0883e;}
.btn{width:100%;padding:13px;border-radius:10px;border:none;background:#f0883e;color:#fff;font-family:'Kanit',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;margin-top:4px;}
.btn:hover{opacity:0.88;}
.err{color:#f85149;font-size:0.8rem;text-align:center;margin-top:8px;min-height:20px;}
.forgot{display:block;text-align:center;margin-top:14px;color:rgba(230,237,243,0.6);font-size:0.82rem;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:'Sarabun',sans-serif;width:100%;padding:4px;}
.reset-msg{text-align:center;font-size:0.8rem;margin-top:6px;min-height:20px;}
.footer{text-align:center;font-size:0.72rem;color:rgba(230,237,243,0.3);margin-top:20px;}
</style>

const app = initializeApp({

const auth = getAuth(app);

onAuthStateChanged(auth, user => {
  if (user) window.location.href = 'index.html';

async function login() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  const err   = document.getElementById('errMsg');
  const btn   = document.getElementById('loginBtn');
  if (!email || !pass) { err.textContent = '❌ กรุณากรอก email และรหัสผ่าน'; return; }

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    err.textContent = '❌ email หรือรหัสผ่านไม่ถูกต้อง';
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
}
window.login = login;

      url: 'https://korat-case.vercel.app',
      handleCodeInApp: false
    };
    await sendPasswordResetEmail(auth, email, actionCodeSettings);
    msg.style.color = '#3fb950';
    msg.textContent = '✅ ส่ง email รีเซ็ตรหัสผ่านแล้ว กรุณาตรวจสอบ inbox ครับ';
    err.textContent = '';
  } catch(e) {
    err.textContent = '❌ ไม่พบ email นี้ในระบบครับ';
  }
});
</script>
