<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 รายงานสำนวนคดี สอจ.นม</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&family=Kanit:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sarabun',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;}
header{background:#161b22;border-bottom:1px solid #30363d;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:10px;}
.header-title{font-family:'Kanit',sans-serif;font-size:1rem;font-weight:700;color:#f0883e;}
.header-sub{font-size:0.72rem;color:#6e7681;}
.btn{padding:8px 16px;border-radius:8px;border:none;font-family:'Sarabun',sans-serif;font-size:0.85rem;cursor:pointer;font-weight:600;}
.btn-export{background:#3fb950;color:#fff;}
.btn-print{background:#f0883e;color:#fff;}
.btn-back{background:transparent;border:1px solid #30363d;color:#8b949e;}
.controls{background:#161b22;border-bottom:1px solid #30363d;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.select{padding:8px 12px;background:#21262d;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-family:'Sarabun',sans-serif;font-size:0.85rem;outline:none;}
.main{padding:20px;}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.sum-card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px;text-align:center;}
.sum-num{font-size:1.8rem;font-weight:700;font-family:'Kanit',sans-serif;}
.sum-lbl{font-size:0.75rem;color:#6e7681;margin-top:4px;}
table{width:100%;border-collapse:collapse;background:#161b22;border-radius:10px;overflow:hidden;}
th{background:#21262d;padding:10px 12px;text-align:left;font-size:0.78rem;color:#8b949e;font-weight:600;border-bottom:1px solid #30363d;}
td{padding:10px 12px;font-size:0.82rem;border-bottom:1px solid #21262d;}
tr:hover td{background:#1c2128;}
.badge{padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:600;}
.badge-pending{background:#2d1a0d;color:#f0883e;}
.badge-progress{background:#0d1f2d;color:#58a6ff;}
.badge-screening{background:#1a2d1a;color:#3fb950;}
.badge-review{background:#2d2810;color:#e3b341;}
.badge-filing{background:#1a1f2d;color:#a29bfe;}
.badge-done{background:#1a2d1a;color:#3fb950;}
.badge-court{background:#1a1f2d;color:#8b949e;}
.overdue{color:#f85149;}
.loading{text-align:center;padding:60px;color:#6e7681;}
@media print{
  body{background:#fff;color:#000;}
  header,.controls{display:none;}
  table{border:1px solid #ccc;}
  th{background:#f0f0f0;color:#000;}
  td{border-bottom:1px solid #eee;color:#000;}
  .badge{border:1px solid #ccc;}
  .sum-card{border:1px solid #ccc;background:#f9f9f9;}
  .sum-num{color:#000 !important;}
}
</style>
</head>

      <div class="header-title">รายงานสำนวนคดี สอจ.นม</div>
      <div class="header-sub" id="reportDate"></div>
    </div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-back" onclick="window.location.href='index.html'">← หน้าหลัก</button>
    <button class="btn btn-export" onclick="exportCSV()">📊 Export CSV</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ พิมพ์</button>
  </div>
</header>

<div class="controls">
  <select class="select" id="viewMode" onchange="switchView()">
    <option value="list">📋 รายการคดี</option>
    <option value="summary">📊 สรุปรายปี</option>
  </select>
  <select class="select" id="filterStatus" onchange="renderReport()">
    <option value="all">📋 ทุกสถานะ</option>
    <option value="active">⏳ ค้างทั้งหมด</option>
    <option value="progress">🔵 เจ้าของสำนวน</option>
    <option value="screening">🔍 รอกลั่นกรอง</option>
    <option value="review">⚖️ อจ.พิจารณา</option>
    <option value="filing">📁 งานพิมพ์สำนวน</option>
    <option value="done">✅ เสร็จสิ้น</option>
    <option value="court">🏛 ศาล</option>
  </select>
  <div style="display:flex;align-items:center;gap:6px;background:#21262d;border:1px solid #30363d;border-radius:8px;padding:6px 10px;">
    <span style="font-size:0.75rem;color:#8b949e;white-space:nowrap;">📅 จาก</span>
    <select class="select" id="dateFrom" onchange="renderReport()" style="border:none;background:transparent;padding:4px;min-width:120px;"></select>
    <span style="font-size:0.75rem;color:#8b949e;">ถึง</span>
    <select class="select" id="dateTo" onchange="renderReport()" style="border:none;background:transparent;padding:4px;min-width:120px;"></select>
    <button onclick="resetDates()" style="padding:4px 8px;border-radius:6px;border:1px solid #30363d;background:transparent;color:#8b949e;font-size:0.72rem;cursor:pointer;white-space:nowrap;">รีเซ็ต</button>
  </div>
  <select class="select" id="filterPerson" onchange="renderReport()">
    <option value="">👤 ทุกคน</option>
  </select>
  <select class="select" id="filterCategory" onchange="renderReport()">
    <option value="">📁 ทุกประเภท</option>
  </select>
  <input type="text" class="select" id="searchInput" placeholder="🔍 ค้นหา..." oninput="renderReport()" style="min-width:180px;">
</div>

<div class="main">
  <div class="summary" id="summaryCards"></div>
  <div id="reportTable"><div class="loading">กำลังโหลดข้อมูล...</div></div>
  <div id="yearSummaryView" style="display:none;"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

const app = initializeApp({
  apiKey:"AIzaSyDuyQeVuxcwKd-_fSgTHhmoBo56cZpUI3A",
  authDomain:"korat-case.firebaseapp.com",
  projectId:"korat-case",
  storageBucket:"korat-case.firebasestorage.app",
  messagingSenderId:"64254577929",
  appId:"1:64254577929:web:7d38588fb2e40ede6697d8"
});
const auth = getAuth(app);
const db = getFirestore(app);

let cases = [], people = [];

const sMap = {
  pending:'สอบสวนเพิ่มเติม', progress:'เจ้าของสำนวน',
  screening:'รอกลั่นกรอง', review:'อจ.พิจารณา',
  filing:'งานพิมพ์สำนวน', done:'เสร็จสิ้น', court:'ศาล'
};
const badgeClass = {
  pending:'badge-pending', progress:'badge-progress', screening:'badge-screening',
  review:'badge-review', filing:'badge-filing', done:'badge-done', court:'badge-court'
};

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'login.html'; return; }
  
  const [pSnap, cSnap] = await Promise.all([
    getDocs(collection(db,'people')),
    getDocs(collection(db,'cases'))
  ]);
  people = pSnap.docs.map(d => ({id:d.id,...d.data()}));
  cases = cSnap.docs.map(d => ({id:d.id,...d.data()}));
  cases.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

  // Populate filters
  const personSel = document.getElementById('filterPerson');
  people.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.name;
    personSel.appendChild(opt);
  });

  const cats = [...new Set(cases.map(c=>c.category).filter(Boolean))].sort();
  const catSel = document.getElementById('filterCategory');
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    catSel.appendChild(opt);
  });

  document.getElementById('reportDate').textContent =
    'ดึงข้อมูล: ' + new Date().toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'});

  renderReport();
});

window.resetDates = function() {
  const fromSel = document.getElementById('dateFrom');
  const toSel = document.getElementById('dateTo');
  if (fromSel) fromSel.value = '';
  if (toSel) toSel.value = '';
  renderReport();
};

window.renderReport = function() {
  const status = document.getElementById('filterStatus').value;
  const personId = document.getElementById('filterPerson').value;
  const category = document.getElementById('filterCategory').value;
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const dateFrom = document.getElementById('dateFrom')?.value || '';
  const dateTo = document.getElementById('dateTo')?.value || '';

  let filtered = cases.filter(c => {
    if (status === 'active') { if (['done','court'].includes(c.status)) return false; }
    else if (status !== 'all') { if (c.status !== status) return false; }
    if (personId && c.assignee !== personId) return false;
    if (category && c.category !== category) return false;
    // Date range filter
    const ym = c.date ? c.date.slice(0,7) : '';
    if (dateFrom && ym < dateFrom) return false;
    if (dateTo && ym > dateTo) return false;
    if (search) {
      const match = (c.caseId||'').toLowerCase().includes(search) ||
                    (c.name||'').toLowerCase().includes(search) ||
                    (c.extQR||'').toLowerCase().includes(search);
      if (!match) return false;
    }
    return true;
  });

  // Summary
  const total = filtered.length;
  const pending = filtered.filter(c=>!['done','court'].includes(c.status)).length;
  const done = filtered.filter(c=>c.status==='done').length;
  const now = new Date();
  const overdue = filtered.filter(c=>c.deadline&&!['done','court'].includes(c.status)&&new Date(c.deadline)<now).length;

  document.getElementById('summaryCards').innerHTML = `
    <div class="sum-card"><div class="sum-num" style="color:#58a6ff">${total}</div><div class="sum-lbl">ทั้งหมด</div></div>
    <div class="sum-card"><div class="sum-num" style="color:#f85149">${pending}</div><div class="sum-lbl">ค้าง</div></div>
    <div class="sum-card"><div class="sum-num" style="color:#3fb950">${done}</div><div class="sum-lbl">เสร็จสิ้น</div></div>
    <div class="sum-card"><div class="sum-num" style="color:#f0883e">${overdue}</div><div class="sum-lbl">เกินกำหนด</div></div>`;

  if (!filtered.length) {
    document.getElementById('reportTable').innerHTML = '<div class="loading">ไม่มีข้อมูล</div>';
    return;
  }

  const rows = filtered.map((c,i) => {
    const person = people.find(p=>p.id===c.assignee);
    const dl = c.deadline ? new Date(c.deadline).toLocaleDateString('th-TH') : '-';
    const isOverdue = c.deadline && !['done','court'].includes(c.status) && new Date(c.deadline) < now;
    return `<tr>
      <td style="color:#6e7681">${i+1}</td>
      <td style="font-weight:600">${c.caseId||'-'}</td>
      <td>${c.name||'-'}</td>
      <td>${c.category||'-'}</td>
      <td>${person?.name||'-'}</td>
      <td><span class="badge ${badgeClass[c.status]||''}">${sMap[c.status]||c.status}</span></td>
      <td>${c.date?new Date(c.date).toLocaleDateString('th-TH'):'-'}</td>
      <td class="${isOverdue?'overdue':''}">${dl}${isOverdue?' ⚠️':''}</td>
    </tr>`;
  }).join('');

  document.getElementById('reportTable').innerHTML = `
    <table>
      <thead><tr>
        <th>#</th><th>เลขรับคดีที่</th><th>ชื่อคดี</th><th>ประเภท</th>
        <th>ผู้รับผิดชอบ</th><th>สถานะ</th><th>วันที่รับ</th><th>Deadline</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  
  window._filteredCases = filtered;
};

window.switchView = function() {
  const mode = document.getElementById('viewMode').value;
  const listControls = ['filterStatus','filterPerson','filterCategory','searchInput'];
  if (mode === 'summary') {
    document.getElementById('reportTable').style.display = 'none';
    document.getElementById('summaryCards').style.display = 'none';
    document.getElementById('yearSummaryView').style.display = 'block';
    listControls.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.closest('.select') ? el.style.display='none' : null;
      if (el) el.style.display = 'none';
    });
    renderYearSummary();
  } else {
    document.getElementById('reportTable').style.display = 'block';
    document.getElementById('summaryCards').style.display = 'flex';
    document.getElementById('yearSummaryView').style.display = 'none';
    listControls.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = '';
    });
    renderReport();
  }
};

window.renderYearSummary = function() {
  const container = document.getElementById('yearSummaryView');
  const now = new Date();
  const currentYear = now.getFullYear();

  const years = [...new Set(cases.map(c => c.date ? new Date(c.date).getFullYear() : null).filter(Boolean))].sort((a,b) => b-a);
  if (!years.includes(currentYear)) years.unshift(currentYear);

  let html = '';
  years.forEach(year => {
    const yearCases = cases.filter(c => c.date && new Date(c.date).getFullYear() === year);
    if (!yearCases.length) return;
    const thYear = year + 543;
    const total = yearCases.length;
    const pending = yearCases.filter(c => !['done','court'].includes(c.status)).length;
    const done = yearCases.filter(c => c.status === 'done').length;
    const court = yearCases.filter(c => c.status === 'court').length;
    const pct = total > 0 ? Math.round(done/total*100) : 0;

    // Person rows
    const personRows = people.map(p => {
      const pc = yearCases.filter(c => c.assignee === p.id);
      if (!pc.length) return '';
      const pt = pc.length;
      const pp = pc.filter(c => !['done','court'].includes(c.status)).length;
      const pd = pc.filter(c => c.status === 'done').length;
      const pco = pc.filter(c => c.status === 'court').length;
      const ppct = pt > 0 ? Math.round(pd/pt*100) : 0;
      const barW = ppct;
      return `
        <div style="background:#0d1117;border-radius:10px;padding:14px;margin-bottom:8px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <div>
              <div style="font-weight:600;font-size:0.88rem;">${p.name}</div>
              <div style="font-size:0.72rem;color:#6e7681;">${p.role||''}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:1.1rem;font-weight:700;color:#58a6ff;font-family:'Kanit',sans-serif;">${pt}</div>
              <div style="font-size:0.7rem;color:#6e7681;">สำนวน</div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;">
            <div style="background:#161b22;border-radius:6px;padding:8px;text-align:center;">
              <div style="font-size:1rem;font-weight:700;color:#f85149;">${pp}</div>
              <div style="font-size:0.68rem;color:#6e7681;">ค้าง</div>
            </div>
            <div style="background:#161b22;border-radius:6px;padding:8px;text-align:center;">
              <div style="font-size:1rem;font-weight:700;color:#3fb950;">${pd}</div>
              <div style="font-size:0.68rem;color:#6e7681;">เสร็จสิ้น</div>
            </div>
            <div style="background:#161b22;border-radius:6px;padding:8px;text-align:center;">
              <div style="font-size:1rem;font-weight:700;color:#8b949e;">${pco}</div>
              <div style="font-size:0.68rem;color:#6e7681;">ศาล</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="flex:1;background:#21262d;border-radius:20px;height:6px;overflow:hidden;">
              <div style="width:${barW}%;background:#3fb950;height:100%;border-radius:20px;transition:width 0.5s;"></div>
            </div>
            <div style="font-size:0.75rem;color:#3fb950;font-weight:600;white-space:nowrap;">${ppct}% เสร็จ</div>
          </div>
        </div>`;
    }).join('');

    html += `
      <div class="year-card" style="margin-bottom:20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div class="year-card-title" style="margin-bottom:0;">📅 ปี พ.ศ. ${thYear}</div>
          <div style="font-size:0.78rem;color:#6e7681;">${total} สำนวน</div>
        </div>

        <!-- รวมทั้งหมด -->
        <div style="background:#1a1f2d;border:1px solid #1a2a4a;border-radius:10px;padding:14px;margin-bottom:14px;">
          <div style="font-size:0.78rem;color:#58a6ff;font-weight:600;margin-bottom:10px;">📊 ภาพรวมทั้งสำนักงาน</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px;">
            <div style="text-align:center;">
              <div style="font-size:1.4rem;font-weight:700;color:#58a6ff;font-family:'Kanit',sans-serif;">${total}</div>
              <div style="font-size:0.7rem;color:#6e7681;">ทั้งหมด</div>
            </div>
            <div style="text-align:center;">
              <div style="font-size:1.4rem;font-weight:700;color:#f85149;font-family:'Kanit',sans-serif;">${pending}</div>
              <div style="font-size:0.7rem;color:#6e7681;">ค้าง</div>
            </div>
            <div style="text-align:center;">
              <div style="font-size:1.4rem;font-weight:700;color:#3fb950;font-family:'Kanit',sans-serif;">${done}</div>
              <div style="font-size:0.7rem;color:#6e7681;">เสร็จสิ้น</div>
            </div>
            <div style="text-align:center;">
              <div style="font-size:1.4rem;font-weight:700;color:#f0883e;font-family:'Kanit',sans-serif;">${pct}%</div>
              <div style="font-size:0.7rem;color:#6e7681;">อัตราเสร็จ</div>
            </div>
          </div>
          <div style="background:#21262d;border-radius:20px;height:8px;overflow:hidden;">
            <div style="width:${pct}%;background:linear-gradient(90deg,#3fb950,#58a6ff);height:100%;border-radius:20px;transition:width 0.5s;"></div>
          </div>
        </div>

        <!-- รายบุคคล -->
        <div style="font-size:0.78rem;color:#8b949e;font-weight:600;margin-bottom:8px;">👤 รายละเอียดแต่ละคน</div>
        ${personRows}
      </div>`;
  });

  container.innerHTML = html || '<div class="loading">ไม่มีข้อมูล</div>';
};

window.exportCSV = function() {
  const filtered = window._filteredCases || cases;
  const headers = ['เลขรับคดีที่','ชื่อคดี','ประเภท','ผู้รับผิดชอบ','สถานะ','วันที่รับ','Deadline','หมายเหตุ'];
  const rows = filtered.map(c => {
    const person = people.find(p=>p.id===c.assignee);
    return [
      c.caseId||'', c.name||'', c.category||'', person?.name||'',
      sMap[c.status]||c.status||'', c.date||'', c.deadline||'',
      (c.note||'').replace(/,/g,'；')
    ];
  });
  const csv = [headers,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const now = new Date();
  a.download = 'สำนวนคดี_'+(now.getFullYear()+543)+'-'+String(now.getMonth()+1).padStart(2,'0')+'.csv';
  a.click();
  URL.revokeObjectURL(url);
};
</script>

</body>
</html>
